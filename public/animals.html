<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海洋小百科｜海洋探險家</title>
<meta name="description" content="搜尋與篩選臺灣海域的海洋生物：鯊魚、魟、珊瑚礁魚、鯨豚、海龜，依程度看白話介紹或原文。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css?v=1">
</head>
<body data-page="animals">
<main>
  <h1>📖 海洋小百科</h1>
  <p class="lead">輸入名字找海洋生物，或用下面的按鈕篩選。點一下看詳細介紹，還可以挑兩種「比一比」。介紹的深淺跟著頁首的「程度」變。</p>
  <section id="cmp" hidden></section>
  <input type="search" id="q" placeholder="輸入名字，例如：鯨鯊、海龜" aria-label="搜尋海洋生物">
  <div class="filters" id="filters"></div>
  <p id="count" class="lead" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <div id="cmpbar" class="cmpbar noprint" hidden></div>
  <dialog id="dlg"><div class="dlg-in" id="dlg-body"></div></dialog>
</main>
<script src="/js/data.js?v=1"></script>
<script src="/js/layout.js?v=1"></script>
<script src="/js/fx.js?v=1"></script>
<script src="/js/progress.js?v=1"></script>
<script src="/js/p-animals.js?v=1"></script>
</body>
</html>
