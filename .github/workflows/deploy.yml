name: deploy sea-explorer

# 海洋探險家（sea.hunglun.com）：Worker＋靜態網頁，push main 就自動部署。沒有資料庫。
# 原始碼真正的家在 ClaudeOnly 的 school/lun-seamuseum/，由 scripts/publish-public.sh 同步上來。
# Actions secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（hunglun2026）。
# Worker 執行期密鑰（NTFY_TOPIC、ADMIN_TOKEN）另外設定，不經過這裡。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-sea-explorer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝相依套件
        run: npm ci
      - name: 資料完整性檢查
        run: npm test
      - name: 部署到 Cloudflare（hunglun2026）
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
