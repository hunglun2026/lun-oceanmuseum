name: deploy sea-explorer

# 海洋探險家（ocean.hunglun.com）：Worker＋靜態網頁，push main 就自動部署。沒有資料庫。
# 原始碼真正的家在 ClaudeOnly 的 school/lun-oceanmuseum/，由 scripts/publish-public.sh 同步上來。
# Actions secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（hunglun2026）。
# Worker 執行期密鑰（NTFY_TOPIC、ADMIN_TOKEN）另外設定，不經過這裡。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # 部署只需要讀程式碼，不給寫入權限

concurrency:
  group: deploy-sea-explorer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 第三方 Action 一律釘 commit SHA（標籤可以被作者改指別處，是供應鏈攻擊入口）；要升級時查新標籤的 SHA 再換
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 安裝相依套件
        run: npm ci
      - name: 資料完整性檢查
        run: npm test
      - name: 部署到 Cloudflare（hunglun2026）
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
